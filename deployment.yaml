
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal
  namespace: default
  labels:
    app: ewaste-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ewaste-portal
  template:
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
        - name: ewaste-portal
          image: jaisshaurya/ewaste-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal-service
  namespace: default
  labels:
    app: ewaste-portal
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30086
